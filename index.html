 if(aba==='lucro')return <div className="p-4 space-y-4"><Head>💰 Lucro estimado por venda</Head><Card><p className="muted text-sm">O cálculo usa o custo por dúzia cadastrado no produto. Para vendas antigas sem custo salvo, usa o custo atual do produto. É uma estimativa antes de despesas gerais.</p></Card><div className="grid grid-cols-2 gap-3"><Card><p className="muted small">Faturamento</p><p className="text-xl font-bold">{money(vendas.reduce((s,v)=>s+Number(v.total||0),0))}</p></Card><Card><p className="muted small">Lucro estimado</p><p className="text-xl font-bold text-green-700">{money(vendas.reduce((s,v)=>s+lucroVenda(v),0))}</p></Card></div>{vendas.slice().reverse().map(v=><Card key={v.id}><div className="flex justify-between gap-2"><div><b>{getCliente(v.clienteId)?.nome||'Cliente removido'}</b><p className="muted small">{getOvo(v.ovoId)?.nome||'Produto removido'} · {v.data}</p><p className="muted small">{v.quantidade} cartela(s) · {money(v.valorDuzia)}/{v.tipoPreco==='cartela'?'cartela':'dúzia'}</p></div><div className="text-right"><p className="muted small">Venda</p><b>{money(v.total)}</b><p className="muted small mt-1">Lucro estimado</p><b className={lucroVenda(v)<0?'text-red-700':'text-green-700'}>{money(lucroVenda(v))}</b></div></div></Card>)}{!vendas.length&&<p className="muted">Registre vendas e o custo por dúzia dos produtos para calcular o lucro.</p>}</div>;
 if(aba==='perdas')return <div className="p-4 space-y-4"><Head>⚠️ Perdas da rota</Head><Card><div className="grid grid-cols-2 gap-2"><label className="text-sm font-bold">Rota<select className="field mt-1" value={rotaEstoque} onChange={e=>setRotaEstoque(e.target.value)}>{DAYS.map(d=><option key={d}>{d}</option>)}</select></label><label className="text-sm font-bold">Data da rota<input type="date" className="field mt-1" value={dataEstoque} onChange={e=>{setDataEstoque(e.target.value);setRotaEstoque(routeForDate(e.target.value))}}/></label></div><p className="muted small mt-3">O cálculo cruza carga, vendas, saídas registradas, trincados e sobras boas. Informe as sobras boas que voltaram para a empresa para não contabilizá-las como perda.</p></Card><Card><h3 className="font-bold mb-2">Como é calculado</h3><p className="text-sm">Perda estimada = trincados (ovos ÷ 12) + diferença positiva não explicada. A diferença é: carregado − vendido − outras saídas − trincados − sobra boa.</p><p className="text-sm muted mt-2">O valor usa o custo por dúzia cadastrado em Produtos. Se o custo estiver zerado, a quantidade será calculada, mas o valor ficará em R$ 0,00.</p></Card><details className="card overflow-hidden"><summary className="cursor-pointer list-none flex items-center justify-between gap-3 font-bold p-4"><span>⚠️ Conferência por produto</span><span className="muted text-sm">{ovos.length} produtos　⌄</span></summary><div className="px-4 pb-3 space-y-2">{ovos.map(o=>{const r=resumoPerda(o,rotaEstoque,dataEstoque);const temDados=r.carregado||r.vendido||r.outrasSaidas||campoPerda(rotaEstoque,dataEstoque,o.id,'trincadosOvos')||campoPerda(rotaEstoque,dataEstoque,o.id,'sobraBoaDuzias');return <Card key={o.id}><div className="flex justify-between gap-3 items-start"><div><b>{o.nome}</b><p className="muted small">Carregado: {qtyFmt(r.carregado)} dz · Vendido: {qtyFmt(r.vendido)} dz</p><p className="muted small">Outras saídas: {qtyFmt(r.outrasSaidas)} dz</p></div><b>{money(r.valor)}</b></div><div className="grid grid-cols-2 gap-2 mt-3"><label className="text-sm">Ovos trincados que voltam<input type="number" min="0" step="1" className="field mt-1" value={campoPerda(rotaEstoque,dataEstoque,o.id,'trincadosOvos')||''} onChange={e=>atualizarPerda(rotaEstoque,dataEstoque,o.id,'trincadosOvos',e.target.value)} placeholder="Quantidade de ovos"/></label><label className="text-sm">Sobra boa que voltou (dúzias)<input type="number" min="0" step="0.01" className="field mt-1" value={campoPerda(rotaEstoque,dataEstoque,o.id,'sobraBoaDuzias')||''} onChange={e=>atualizarPerda(rotaEstoque,dataEstoque,o.id,'sobraBoaDuzias',e.target.value)} placeholder="Ex.: 5,5"/></label></div><div className="grid grid-cols-2 gap-2 mt-3 text-sm"><div className="rounded-lg bg-gray-50 p-2">Trincados: <b>{qtyFmt(r.trincados)} dz</b><p className="muted small">Valor: {money(r.valorTrincados)}</p></div><div className="rounded-lg bg-gray-50 p-2">Perda não explicada: <b>{qtyFmt(r.perdaNaoExplicada)} dz</b><p className="muted small">Valor: {money(r.valorNaoExplicado)}</p></div></div>{r.diferenca < -0.01&&<p className="text-amber-700 text-sm mt-2">Há {qtyFmt(Math.abs(r.diferenca))} dúzias a mais que o esperado. Confira os registros.</p>}{!temDados&&<p className="muted small mt-2">Nenhuma carga ou venda encontrada para este produto nesta rota/data.</p>}</Card>})}</div></details><Card><h3 className="font-bold">Total de perdas estimadas</h3><div className="mt-3 space-y-2"><p className="flex justify-between"><span>Trincados retornados</span><b>{qtyFmt(ovos.reduce((s,o)=>s+resumoPerda(o,rotaEstoque,dataEstoque).trincados,0))} dúzias</b></p><p className="flex justify-between"><span>Perdas não explicadas</span><b>{qtyFmt(ovos.reduce((s,o)=>s+resumoPerda(o,rotaEstoque,dataEstoque).perdaNaoExplicada,0))} dúzias</b></p><p className="flex justify-between border-t pt-2 text-lg"><b>Valor estimado das perdas</b><b>{money(ovos.reduce((s,o)=>s+resumoPerda(o,rotaEstoque,dataEstoque).valor,0))}</b></p></div></Card></div>;
 if(aba==='backup')return <div className="p-4 space-y-4"><Head>🗄️ Backup e restauração</Head><Card><h3 className="font-bold">Exportar backup</h3><p className="muted text-sm my-2">Baixe um arquivo JSON com clientes, produtos, vendas, despesas, saldo inicial e movimentações de estoque. Faça isso regularmente e guarde o arquivo fora do celular.</p><button className="btn primary w-full" onClick={exportarBackup}>Baixar backup agora</button></Card><Card><h3 className="font-bold">Restaurar backup</h3><p className="muted text-sm my-2">Selecione um arquivo JSON exportado por este sistema. A restauração substitui os dados atuais deste navegador; exporte um backup atual antes de continuar.</p><input key={restoreKey} type="file" accept="application/json,.json" className="field" onChange={restaurarBackup}/></Card><Card><h3 className="font-bold">Resumo local</h3><p className="muted text-sm mt-2">{clientes.length} clientes · {ovos.length} produtos · {vendas.length} vendas · {gastos.length} despesas · {movimentos.length} movimentações de estoque · perdas por rota salvas automaticamente.</p><p className="text-amber-700 text-sm mt-2">Atenção: os dados ficam neste navegador/aparelho. O backup é importante para evitar perdas se os dados locais forem apagados.</p></Card></div>;
 if(aba==='whatsapp')return <div className="p-4 space-y-4"><Head>💬 Atalhos para WhatsApp</Head><Card><p className="muted text-sm">Abra a conversa de um cliente ou prepare uma mensagem de cobrança para vendas pendentes.</p><select className="field mt-3" value={clienteHistorico} onChange={e=>setClienteHistorico(e.target.value)}><option value="">Selecione um cliente</option>{clientes.map(c=><option key={c.id} value={c.id}>{c.nome} · {c.telefone||'sem telefone'}</option>)}</select><div className="grid grid-cols-1 gap-2 mt-3"><button className="btn green" disabled={!clienteHistorico} onClick={()=>{const c=getCliente(clienteHistorico);abrirWhatsApp(c,`Olá, ${c?.nome||''}! Tudo bem? Aqui é da Ovos Dionísio. Estou à disposição para atender seu pedido de ovos.`)}}>Mensagem de atendimento</button><button className="btn primary" disabled={!clienteHistorico} onClick={()=>{const c=getCliente(clienteHistorico);abrirWhatsApp(c,`Olá, ${c?.nome||''}! Tudo bem? Passando para lembrar sobre o pagamento que está em aberto conosco. Quando puder, me dê um retorno. Obrigado!`)}}>Mensagem de cobrança genérica</button></div></Card><details className="card overflow-hidden"><summary className="cursor-pointer list-none flex items-center justify-between gap-3 font-bold p-4"><span>💬 Vendas pendentes</span><span className="muted text-sm">{vendas.filter(v=>v.status==='pendente').length} registros　⌄</span></summary><div className="px-4 pb-3 space-y-2">{vendas.filter(v=>v.status==='pendente').map(v=><Card key={v.id}><div className="flex justify-between gap-3"><div><b>{getCliente(v.clienteId)?.nome||'Cliente removido'}</b><p className="muted small">{v.data} · {money(v.total)}</p></div><button className="btn green self-center" onClick={()=>cobrar(v)}>Preparar cobrança</button></div></Card>)}{!vendas.some(v=>v.status==='pendente')&&<p className="muted">Não há cobranças pendentes.</p>}</div></details></div>;
 if(aba==='gerenciar')return <div className="p-4 space-y-3"><Head>✏️ Editar e excluir registros</Head><p className="muted text-sm">Toque em cada seção para abrir ou recolher os registros.</p>
 <details className="card overflow-hidden"><summary className="cursor-pointer list-none flex items-center justify-between gap-3 font-bold p-4"><span>👥 Clientes</span><span className="muted text-sm">{clientes.length} registros　⌄</span></summary><div className="px-4 pb-3">{clientes.map(c=><div key={c.id} className="border-b py-3 flex justify-between gap-2"><div><b>{c.nome}</b><p className="muted small">{c.telefone||'Sem telefone'}</p></div><div className="flex gap-3"><button className="text-blue-700" onClick={()=>editarCliente(c)}>Editar</button><button className="text-red-600" onClick={()=>excluir('cliente',c.id)}>Excluir</button></div></div>)}{!clientes.length&&<p className="muted small py-3">Nenhum cliente.</p>}</div></details>
 <details className="card overflow-hidden"><summary className="cursor-pointer list-none flex items-center justify-between gap-3 font-bold p-4"><span>🥚 Produtos</span><span className="muted text-sm">{ovos.length} registros　⌄</span></summary><div className="px-4 pb-3">{ovos.map(o=><div key={o.id} className="border-b py-3 flex justify-between gap-2"><div><b>{o.nome}</b><p className="muted small">{o.equivalente} dúzias/cartela</p></div><div className="flex gap-3"><button className="text-blue-700" onClick={()=>editarOvo(o)}>Editar</button><button className="text-red-600" onClick={()=>excluir('ovo',o.id)}>Excluir</button></div></div>)}{!ovos.length&&<p className="muted small py-3">Nenhum produto.</p>}</div></details>
 <details className="card overflow-hidden"><summary className="cursor-pointer list-none flex items-center justify-between gap-3 font-bold p-4"><span>🛒 Vendas</span><span className="muted text-sm">{vendas.length} registros　⌄</span></summary><div className="px-4 pb-3">{vendas.slice().reverse().map(v=><div key={v.id} className="border-b py-3 flex justify-between gap-2"><div><b>{getCliente(v.clienteId)?.nome||'Cliente removido'}</b><p className="muted small">{v.data} · {money(v.total)} · {v.status}</p></div><div className="flex flex-col gap-2"><button className="text-blue-700" onClick={()=>editarVenda(v)}>Editar</button><button className="text-red-600" onClick={()=>excluir('venda',v.id)}>Excluir</button></div></div>)}{!vendas.length&&<p className="muted small py-3">Nenhuma venda.</p>}</div></details>
 <details className="card overflow-hidden"><summary className="cursor-pointer list-none flex items-center justify-between gap-3 font-bold p-4"><span>📉 Despesas</span><span className="muted text-sm">{gastos.length} registros　⌄</span></summary><div className="px-4 pb-3">{gastos.slice().reverse().map(g=><div key={g.id} className="border-b py-3 flex justify-between gap-2"><div><b>{g.descricao}</b><p className="muted small">{g.data} · {money(g.valor)}</p></div><div className="flex flex-col gap-2"><button className="text-blue-700" onClick={()=>editarGasto(g)}>Editar</button><button className="text-red-600" onClick={()=>excluir('gasto',g.id)}>Excluir</button></div></div>)}{!gastos.length&&<p className="muted small py-3">Nenhuma despesa.</p>}</div></details></div>;
 if(aba==='fechamento')return <div className="p-4 space-y-4">
 <Head>🧾 Fechamento de caixa</Head>
 <Card><div className="flex flex-wrap items-end justify-between gap-3"><div><p className="text-xs uppercase tracking-widest muted">Ovos Dionísio · Conferência diária</p><h3 className="text-xl font-extrabold">Folha de fechamento</h3></div><label className="text-sm font-semibold">Data do fechamento<input type="date" className="field mt-1" value={dataFechamento} onChange={e=>setDataFechamento(e.target.value)}/></label></div><p className="muted small mt-2">A saída inicial usa automaticamente o valor padrão configurado abaixo, salvo se houver um valor específico para esta data. Vendas, vales baixados e gastos são somados pelo sistema.</p><label className="block text-sm font-semibold mt-3">Saída de caixa padrão fornecida pela empresa (R$)<input type="number" min="0" step="0.01" value={saidaCaixa} onChange={e=>setSaidaCaixa(e.target.value)} className="field mt-1" placeholder="Informe o valor padrão de abertura"/></label><label className="block text-sm font-semibold mt-3">Saída de caixa para esta data (opcional)<input type="number" min="0" step="0.01" value={saidasCaixaDia[dataFechamento]??''} onChange={e=>setSaidasCaixaDia({...saidasCaixaDia,[dataFechamento]:e.target.value})} className="field mt-1" placeholder={`Automático: ${money(saidaCaixa||0)}`}/></label><p className="muted small mt-1">Deixe em branco para usar o valor padrão. A saída de caixa é positiva e soma ao total disponível.</p></Card>

  </section>
  <section className="bg-white border-2 border-gray-300 rounded-md p-4 shadow-sm">
   <div className="text-center border-b-2 border-gray-800 pb-3 mb-4"><p className="text-xs uppercase tracking-widest">Lado direito</p><h3 className="font-extrabold text-lg">Conferência física</h3><p className="text-xs muted">Dinheiro contado e recebimentos</p></div>

     <label className="block font-semibold">Dinheiro em cédulas (manual)<input type="number" min="0" step="0.01" className="field mt-1 text-base" value={dinheiroContadoDia[dataFechamento]??''} onChange={e=>setDinheiroContadoDia({...dinheiroContadoDia,[dataFechamento]:e.target.value})} placeholder="Informe o valor contado em cédulas"/></label>

 </div>
 <Head>Detalhamento do dia</Head>
 <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
  <Card><h3 className="font-bold mb-3">Gastos lançados</h3>{gastosDoDia.length?<div className="space-y-3">{gastosDoDia.slice().reverse().map(g=><div key={g.id} className="flex justify-between gap-3 border-b pb-2 last:border-0"><div><b>{g.descricao||g.tipo||'Gasto'}</b><p className="muted small">{g.data||dataFechamento}</p></div><b className="whitespace-nowrap">{money(g.valor)}</b></div>)}<div className="flex justify-between pt-2 font-bold"><span>Total de gastos</span><span>{money(totalGastosDia)}</span></div></div>:<p className="muted">Nenhum gasto lançado para esta data.</p>}</Card>
  <Card><h3 className="font-bold mb-3">Resumo dos recebimentos</h3><div className="space-y-3"><p className="flex justify-between"><span>Vendas à vista</span><b>{money(vendaAVistaDia)}</b></p><p className="flex justify-between"><span>Vales baixados hoje</span><b>{money(valesRecebidosDia)}</b></p><p className="flex justify-between"><span>Dinheiro contado (cédulas + moedas ajustadas)</span><b>{money(dinheiroFisico)}</b></p><p className="flex justify-between"><span>Vendas recebidas em dinheiro</span><b>{money(dinheiroVendasDia)}</b></p><p className="flex justify-between"><span>Vales recebidos em dinheiro</span><b>{money(dinheiroValesDia)}</b></p><p className="flex justify-between"><span>Moedas calculadas automaticamente</span><b>{money(moedasAutomaticas)}</b></p><p className="flex justify-between"><span>Cheque (vendas + vales)</span><b>{money(chequeConferido)}</b></p><p className="flex justify-between"><span>Pix (vendas + vales)</span><b>{money(pixConferido)}</b></p><p className="muted small">Ao baixar um vale em Contas a receber, selecione Dinheiro, Pix ou Cheque. A data da baixa define em qual fechamento esse recebimento será considerado.</p></div></Card>
 </div>
 </div>;
 if(aba==='vendas_realizadas')return <div className="p-4 space-y-3"><Head>✅ Vendas realizadas</Head><details className="card overflow-hidden"><summary className="cursor-pointer list-none flex items-center justify-between gap-3 font-bold p-4"><span>✅ Histórico de vendas</span><span className="muted text-sm">{vendas.length} registros　⌄</span></summary><div className="px-4 pb-3 space-y-2">{vendas.slice().reverse().map(v=><Card key={v.id}><div className="flex justify-between gap-3"><div><b>{getCliente(v.clienteId)?.nome||'Cliente removido'}</b><p className="muted small">{getOvo(v.ovoId)?.nome||'Produto removido'} · {v.data}</p><p className="muted small">{v.formaPagamento} · {v.status==='pago'?'Pago':'Pendente'}</p></div><b>{money(v.total)}</b></div></Card>)}</div></details></div>;
 return <div className="p-4 muted">Selecione uma opção no menu.</div>;
 };
 return <div><header className="text-white p-3 flex justify-between items-center sticky top-0 shadow-md z-30" style={{background:"linear-gradient(115deg,#071735,#102b59)"}}><button onClick={()=>setMenu(true)} className="text-2xl font-bold px-2" aria-label="Abrir menu">☰</button><div className="flex-1 text-center"><div className="brand-name">OVOS DIONÍSIO</div><div className="brand-sub">GESTÃO</div><p className="text-xs mt-1" style={{color:"#d7e1f2"}}>{titulo}</p></div><div className="w-8" aria-hidden="true"></div></header>
 {menu&&<div className="fixed inset-0 bg-black/50 z-50 flex" onClick={()=>setMenu(false)}><div className="bg-white w-80 max-w-[88vw] h-full p-4 overflow-y-auto shadow-xl" onClick={e=>e.stopPropagation()}><div className="flex justify-between items-center mb-4"><h2 className="font-bold text-lg">Menu e ferramentas</h2><button className="text-2xl" onClick={()=>setMenu(false)}>×</button></div><p className="text-xs uppercase tracking-wide muted mb-2">Novas funções</p>{menuItems.map(([id,emoji,label])=><button key={id} onClick={()=>ir(id)} className={'w-full text-left p-3 rounded-lg mb-1 font-semibold '+(aba===id?'bg-blue-100 text-blue-800':'hover:bg-gray-100 text-gray-800')}><span className="mr-2">{emoji}</span>{label}</button>)}<hr className="my-3"/><p className="text-xs uppercase tracking-wide muted mb-2">Telas principais</p>{[['clientes','👥','Clientes'],['ovos','🥚','Produtos'],['vender','🛒','Lançar venda'],['estoque','📦','Estoque'],['receber','📥','Contas a receber'],['gastos','📉','Despesas de rota']].map(([id,em,label])=><button key={id} onClick={()=>ir(id)} className={'w-full text-left p-3 rounded-lg mb-1 font-semibold '+(aba===id?'bg-blue-100 text-blue-800':'hover:bg-gray-100')}><span className="mr-2">{em}</span>{label}</button>)}<p className="muted text-xs mt-4">Dados armazenados localmente neste navegador.</p></div><div className="flex-1"/></div>}
 <main className="max-w-xl mx-auto">{render()}</main>
 <nav className="fixed bottom-0 w-full bg-white border-t flex justify-around p-2 text-[11px] font-bold z-40 shadow-lg">{[['vender','🛒','Vender'],['estoque','📦','Estoque'],['receber','📥','Receber'],['gastos','📉','Gastos'],['fechamento','🧾','Fechamento']].map(([id,em,label])=><button key={id} onClick={()=>setAba(id)} className={'flex flex-col items-center px-2 py-1 '+(aba===id?'text-blue-700':'text-gray-500')}><span className="text-xl mb-1">{em}</span>{label}</button>)}</nav>
 {aviso&&<div className="fixed bottom-20 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-3 rounded-xl shadow-xl z-[60] text-sm max-w-[90vw]">{aviso}</div>}
 </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<div id="connection-status" role="status" aria-live="polite" style="position:fixed;top:8px;right:8px;z-index:1000;display:none;padding:6px 10px;border-radius:999px;font:600 12px system-ui,sans-serif;background:#991b1b;color:#fff;box-shadow:0 2px 8px #0002">
  Sem internet — dados ficam neste aparelho
</div>
<script>
(function () {
  const status = document.getElementById('connection-status');
  function updateConnectionStatus() {
    const offline = !navigator.onLine;
    status.style.display = offline ? 'block' : 'none';
    status.textContent = offline
      ? 'Sem internet — dados ficam neste aparelho'
      : '';
  }
  window.addEventListener('online', updateConnectionStatus);
  window.addEventListener('offline', updateConnectionStatus);
  updateConnectionStatus();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (error) {
        console.error('Falha ao registrar o modo instalável:', error);
      });
    });
  }
})();
</script>

</body>
